name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  pinned-keys:
    name: Valtry signing key pinned
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A release must never ship the placeholder: the Valtry path would stay
      # fail-closed (public feeds only) for everyone who installs it.
      - name: Refuse a release with a placeholder key
        run: |
          php -r 'require "src/Valtry/Keys.php"; if (Ruvelo\SecurityAdvisories\Valtry\Keys::hasPlaceholders() || Ruvelo\SecurityAdvisories\Valtry\Keys::decode() === []) { echo("::error file=src/Valtry/Keys.php::Keys::PINNED still holds a placeholder. Pin the public key printed by php artisan advisories:keygen before tagging.\n"); exit(1); }'

  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sodium
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        stability: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sodium
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
